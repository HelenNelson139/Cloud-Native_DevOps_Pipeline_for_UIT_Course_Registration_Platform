name: Reusable Service CI/CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      app_path:
        required: true
        type: string
      runtime:
        required: true
        type: string
      docker_context:
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: ""
      manifest_paths:
        required: false
        type: string
        default: ""
      build_image:
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  deployments: write
  packages: write

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

concurrency:
  group: service-gitops-${{ github.ref }}-${{ inputs.image_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ inputs.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.app_path }}/package-lock.json

      - name: Install Node dependencies
        if: ${{ inputs.runtime == 'node' }}
        working-directory: ${{ inputs.app_path }}
        run: npm ci

      - name: Audit Node dependencies
        if: ${{ inputs.runtime == 'node' }}
        continue-on-error: ${{ vars.SECURITY_GATE != 'true' }}
        working-directory: ${{ inputs.app_path }}
        run: npm audit --omit=dev --audit-level=high

      - name: Run Node tests
        if: ${{ inputs.runtime == 'node' }}
        working-directory: ${{ inputs.app_path }}
        run: npm run test:ci --if-present

      - name: Build Node application
        if: ${{ inputs.runtime == 'node' }}
        working-directory: ${{ inputs.app_path }}
        run: npm run build --if-present

      - name: Setup Python
        if: ${{ inputs.runtime == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ${{ inputs.app_path }}/requirements.txt

      - name: Install Python dependencies
        if: ${{ inputs.runtime == 'python' }}
        working-directory: ${{ inputs.app_path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit Python dependencies
        if: ${{ inputs.runtime == 'python' }}
        continue-on-error: ${{ vars.SECURITY_GATE != 'true' }}
        working-directory: ${{ inputs.app_path }}
        run: python -m pip_audit -r requirements.txt

      - name: Run Python tests
        if: ${{ inputs.runtime == 'python' }}
        working-directory: ${{ inputs.app_path }}
        run: pytest

      - name: Check Python syntax
        if: ${{ inputs.runtime == 'python' }}
        working-directory: ${{ inputs.app_path }}
        run: python -m py_compile main.py train.py core/*.py

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && inputs.runtime != 'docker' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ inputs.image_name }}
            -Dsonar.projectName=${{ inputs.service_name }}
            -Dsonar.sources=${{ inputs.app_path }}

  build-scan-push:
    name: Build, scan, publish, update GitOps
    if: ${{ inputs.build_image }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Determine publish mode
        id: publish-mode
        run: |
          enabled=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request run: image will be built and scanned locally only."
          elif [ "${{ vars.ENABLE_DEPLOY }}" != "true" ]; then
            echo "ENABLE_DEPLOY is not true: image will be built and scanned locally only."
          else
            missing=0
            for name in ACR_LOGIN_SERVER ACR_NAME AZURE_CREDENTIALS; do
              if [ -z "${!name}" ]; then
                echo "::warning::$name is required to publish ${{ inputs.service_name }}."
                missing=1
              fi
            done

            if [ "$missing" -eq 0 ]; then
              enabled=true
            else
              echo "::warning::Publish is disabled because one or more deployment secrets are missing."
            fi
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Show publish mode
        run: |
          if [ "${{ steps.publish-mode.outputs.enabled }}" = "true" ]; then
            echo "Publish mode enabled. Image will be pushed to ACR and GitOps manifests will be updated."
          else
            echo "Publish mode disabled. CI will stop after local image build and Trivy scan."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        id: build-image
        run: |
          if [ "${{ steps.publish-mode.outputs.enabled }}" = "true" ]; then
            IMAGE_REF="$ACR_LOGIN_SERVER/${{ inputs.image_name }}:${{ github.sha }}"
          else
            IMAGE_REF="${{ inputs.image_name }}:ci-${{ github.sha }}"
          fi

          docker buildx build \
            --cache-from type=gha,scope="${{ inputs.image_name }}" \
            --cache-to type=gha,mode=max,scope="${{ inputs.image_name }}" \
            -t "$IMAGE_REF" \
            -f "${{ inputs.dockerfile }}" \
            --load \
            "${{ inputs.docker_context }}"

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build-image.outputs.image_ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          timeout: 10m
          exit-code: ${{ vars.SECURITY_GATE == 'true' && '1' || '0' }}

      - name: Push Docker image
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        run: docker push "${{ steps.build-image.outputs.image_ref }}"

      - name: Login to GitHub Container Registry
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Mirror Docker image to GitHub Packages
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          GHCR_OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE_REF="ghcr.io/$GHCR_OWNER/${{ inputs.image_name }}:${{ github.sha }}"
          docker tag "${{ steps.build-image.outputs.image_ref }}" "$GHCR_IMAGE_REF"
          docker push "$GHCR_IMAGE_REF"
          echo "Mirrored image to $GHCR_IMAGE_REF"

      - name: Install yq
        if: ${{ steps.publish-mode.outputs.enabled == 'true' && inputs.manifest_paths != '' }}
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes manifests
        if: ${{ steps.publish-mode.outputs.enabled == 'true' && inputs.manifest_paths != '' }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REF: ${{ steps.build-image.outputs.image_ref }}
        run: |
          for manifest in ${{ inputs.manifest_paths }}; do
            if [ ! -f "$manifest" ]; then
              echo "::warning::Manifest not found: $manifest"
              continue
            fi

            yq -i '
              (.. | select(tag == "!!map" and has("image")).image | select(test("(^|/)" + strenv(IMAGE_NAME) + ":"))) =
                strenv(IMAGE_REF)
            ' "$manifest"
          done

      - name: Validate Kubernetes manifests
        if: ${{ steps.publish-mode.outputs.enabled == 'true' && inputs.manifest_paths != '' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            k8s/base \
            k8s/backing-services \
            k8s/services \
            k8s/autoscaling \
            k8s/ingress \
            k8s/rollouts \
            k8s/jobs

      - name: Commit updated GitOps manifests
        if: ${{ steps.publish-mode.outputs.enabled == 'true' && inputs.manifest_paths != '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ${{ inputs.manifest_paths }}

          if git diff --cached --quiet; then
            echo "No manifest image tag changes to commit."
            exit 0
          fi

          git commit -m "Update ${{ inputs.image_name }} image to ${{ github.sha }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create GitHub Deployment
        if: ${{ steps.publish-mode.outputs.enabled == 'true' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_ENV: aks-production-${{ inputs.image_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: process.env.DEPLOY_ENV,
              description: `${process.env.SERVICE_NAME} image published and GitOps manifests updated`,
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: process.env.PUBLIC_APP_URL || undefined,
              log_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              description: "Ready for Argo CD sync"
            });

  notify-on-failure:
    name: Notify ${{ inputs.service_name }} failure
    needs:
      - validate
      - build-scan-push
    if: ${{ always() && (contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')) }}
    runs-on: ubuntu-latest
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send failure notification
        run: |
          MESSAGE="${{ inputs.service_name }} CI/CD failed for ${{ github.repository }} on branch ${{ github.ref_name }} at commit ${{ github.sha }}. Run: $WORKFLOW_URL"

          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              --data "{\"@type\":\"MessageCard\",\"@context\":\"https://schema.org/extensions\",\"summary\":\"CI/CD failed\",\"themeColor\":\"D13438\",\"title\":\"${{ inputs.service_name }} pipeline failed\",\"text\":\"$MESSAGE\"}" \
              "$TEAMS_WEBHOOK_URL"
          else
            echo "No notification channel configured. Add TEAMS_WEBHOOK_URL repository secret to enable Teams notifications."
          fi
