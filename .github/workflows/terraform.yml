name: Terraform IaC

on:
  pull_request:
    branches:
      - main
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  push:
    branches:
      - main
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  TFSTATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ secrets.TFSTATE_CONTAINER }}
  TFSTATE_KEY: ${{ secrets.TFSTATE_KEY }}
  TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Format, validate, scan, plan, apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          skip_path: terraform/.terraform,terraform/terraform.tfstate,terraform/terraform.tfstate.backup
          soft_fail: ${{ vars.SECURITY_GATE != 'true' }}

      - name: Azure login
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: |
          if [ -n "$TFSTATE_STORAGE_ACCOUNT" ]; then
            terraform init \
              -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP:-uit-tfstate-rg}" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=${TFSTATE_CONTAINER:-tfstate}" \
              -backend-config="key=${TFSTATE_KEY:-uit-course.terraform.tfstate}"
          else
            echo "::warning::TFSTATE_STORAGE_ACCOUNT is not set. Running init with backend disabled."
            terraform init -backend=false
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Check Terraform deployment secrets
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          missing=0
          for name in AZURE_CREDENTIALS TFSTATE_STORAGE_ACCOUNT TF_VAR_db_admin_password; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Terraform plan/apply on main."
              missing=1
            fi
          done
          exit "$missing"

      - name: Terraform plan
        if: ${{ env.AZURE_CREDENTIALS != '' && env.TF_VAR_db_admin_password != '' }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AZURE_CREDENTIALS != '' && env.TF_VAR_db_admin_password != '' }}
        run: terraform apply -auto-approve tfplan

  notify-on-failure:
    name: Notify Terraform failure
    needs: terraform
    if: ${{ always() && (needs.terraform.result == 'failure' || needs.terraform.result == 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send failure notification
        run: |
          MESSAGE="Terraform workflow failed for ${{ github.repository }} on branch ${{ github.ref_name }} at commit ${{ github.sha }}. Run: $WORKFLOW_URL"

          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              --data "{\"@type\":\"MessageCard\",\"@context\":\"https://schema.org/extensions\",\"summary\":\"Terraform failed\",\"themeColor\":\"D13438\",\"title\":\"Terraform workflow failed\",\"text\":\"$MESSAGE\"}" \
              "$TEAMS_WEBHOOK_URL"
          else
            echo "No notification channel configured. Add TEAMS_WEBHOOK_URL repository secret to enable Teams notifications."
          fi
