apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uit-course
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HelenNelson139/Cloud-Native_DevOps_Pipeline_for_UIT_Course_Registration_Platform.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
